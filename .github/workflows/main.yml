name: Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x Rover_Hardware_Verification_Android_NDK/gradlew

    - name: Build Debug APK
      run: cd Rover_Hardware_Verification_Android_NDK && ./gradlew assembleDebug

    - name: Build Release APK
      run: cd Rover_Hardware_Verification_Android_NDK && ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: Rover_Hardware_Verification_Android_NDK/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: Rover_Hardware_Verification_Android_NDK/app/build/outputs/apk/release/app-release-unsigned.apk
