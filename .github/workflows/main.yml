name: Android Build

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Auto-fix Project Resources
        run: |
          PROJECT_DIR="Rover_Hardware_Verification_Android_NDK"
          mkdir -p "$PROJECT_DIR/app/src/main/res/values"
          
          # Create strings.xml
          cat << 'EOF' > "$PROJECT_DIR/app/src/main/res/values/strings.xml"
          <resources>
              <string name="app_name">Rover HW Verify</string>
          </resources>
          EOF

          # Create styles.xml
          cat << 'EOF' > "$PROJECT_DIR/app/src/main/res/values/styles.xml"
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          # Ensure gradle.properties exists with AndroidX enabled
          cat << 'EOF' > "$PROJECT_DIR/gradle.properties"
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Build Debug APK
        run: |
          cd Rover_Hardware_Verification_Android_NDK
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: Rover_Hardware_Verification_Android_NDK/app/build/outputs/apk/debug/app-debug.apk
