<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rover HUD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 4px;
    }
    h1 { font-size: 12px; color: #38bdf8; }
    #badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      background: #1e293b;
      color: #94a3b8;
    }
    #stage-canvas {
      width: 100%;
      height: 48%;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 4px;
      display: block;
    }
    .diag-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 10px;
    }
    .diag-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .diag-label { color: #64748b; }
    .diag-val { color: #f8fafc; font-weight: bold; }
    .status-error { color: #f87171 !important; }
    .status-pass { color: #4ade80 !important; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto; }
    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 6px;
      border-radius: 3px;
      font-size: 10px;
      font-family: inherit;
    }
    button.primary { background: #0284c7; }
  </style>
</head>
<body>

  <header>
    <h1>ROVER HUD</h1>
    <div id="badge">WAITING FOR CAMERA</div>
  </header>

  <!-- Portrait 240x320 Canvas -->
  <canvas id="stage-canvas" width="240" height="320"></canvas>

  <div class="diag-box">
    <div class="diag-row">
      <span class="diag-label">AUDIT:</span>
      <span id="audit-status" class="diag-val">NO DATA</span>
    </div>
    <div class="diag-row">
      <span class="diag-label">BLOBS:</span>
      <span id="blob-status" class="diag-val">Far: -- | Near: --</span>
    </div>
    <div class="diag-row">
      <span class="diag-label">1D OTSU:</span>
      <span id="otsu-status" class="diag-val">Far: -- | Near: --</span>
    </div>
    <div class="diag-row">
      <span class="diag-label">GAUGE:</span>
      <span id="gauge-status" class="diag-val">Far: -- | Near: --</span>
    </div>
  </div>

  <div class="controls">
    <button class="primary" onclick="setScreenPreset()">Screen Target Preset</button>
    <button onclick="setTrackPreset()">Outdoor Track Preset</button>
  </div>

  <script>
    const canvas = document.getElementById('stage-canvas');
    const ctx = canvas.getContext('2d');
    let frameCount = 0;

    function drawIdle() {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, 240, 320);

      ctx.strokeStyle = '#334155';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, 90); ctx.lineTo(240, 90);
      ctx.moveTo(0, 280); ctx.lineTo(240, 280);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#64748b';
      ctx.font = '9px monospace';
      ctx.fillText('FAR SCANLINE (Y=90)', 6, 85);
      ctx.fillText('NEAR SCANLINE (Y=280)', 6, 275);
    }
    drawIdle();

    function setScreenPreset() {
      if (window.RoverBridge) {
        // farY=90, nearY=280, focus=2.5D, vyThresh=3.0, wMin=2, wMax=35, gMin=30, gMax=220
        window.RoverBridge.configurePipeline(90, 280, 2.5, 3.0, 2, 35, 30, 220);
        document.getElementById('audit-status').innerText = 'SCREEN PRESET SENT';
      }
    }

    function setTrackPreset() {
      if (window.RoverBridge) {
        window.RoverBridge.configurePipeline(90, 280, 1.2, 3.0, 4, 30, 50, 210);
        document.getElementById('audit-status').innerText = 'OUTDOOR PRESET SENT';
      }
    }

    window.onPipelineResult = function(result) {
      frameCount++;
      const badge = document.getElementById('badge');
      const auditStatus = document.getElementById('audit-status');
      const blobStatus = document.getElementById('blob-status');
      const otsuStatus = document.getElementById('otsu-status');
      const gaugeStatus = document.getElementById('gauge-status');

      badge.style.background = '#064e3b';
      badge.style.color = '#34d399';
      badge.innerText = `FRAME #${frameCount}`;

      otsuStatus.innerText = `Far: ${result.otsuFar} | Near: ${result.otsuNear}`;

      if (!result.frameValid) {
        auditStatus.className = 'diag-val status-error';
        auditStatus.innerText = `DROPPED: ${result.reason}`;

        if (result.reason === 'BLOB_COUNT_FAIL') {
          blobStatus.innerText = `Far: ${result.farBlobsCount} (need 2) | Near: ${result.nearBlobsCount} (need 2)`;
        } else if (result.reason === 'GEOMETRY_FAIL') {
          gaugeStatus.innerText = `Far: ${result.farGauge.toFixed(1)}px | Near: ${result.nearGauge.toFixed(1)}px`;
        }
        drawIdle();
        return;
      }

      auditStatus.className = 'diag-val status-pass';
      auditStatus.innerText = 'PASS: 4 CORNERS LOCKED';
      blobStatus.innerText = 'Far: 2 (OK) | Near: 2 (OK)';
      gaugeStatus.innerText = `Far: ${result.farGauge.toFixed(1)}px | Near: ${result.nearGauge.toFixed(1)}px`;

      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, 240, 320);

      // Scanline guides
      ctx.strokeStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(0, result.farLeft.y); ctx.lineTo(240, result.farLeft.y);
      ctx.moveTo(0, result.nearLeft.y); ctx.lineTo(240, result.nearLeft.y);
      ctx.stroke();

      // Verified trapezoid
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(result.nearLeft.x, result.nearLeft.y);
      ctx.lineTo(result.farLeft.x, result.farLeft.y);
      ctx.lineTo(result.farRight.x, result.farRight.y);
      ctx.lineTo(result.nearRight.x, result.nearRight.y);
      ctx.closePath();
      ctx.stroke();

      // Centroid markers
      ctx.fillStyle = '#4ade80';
      [result.nearLeft, result.nearRight, result.farLeft, result.farRight].forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    };

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(setScreenPreset, 400);
    });
  </script>
</body>
</html>
