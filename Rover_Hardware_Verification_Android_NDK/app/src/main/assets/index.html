<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rover Hardware Verification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
    }
    h1 { font-size: 14px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-badge.live { background: #064e3b; color: #34d399; }
    .status-badge.dropped { background: #7f1d1d; color: #f87171; }

    #stage-canvas {
      width: 100%;
      height: 52%;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      display: block;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 11px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 4px;
      padding: 6px 8px;
    }
    .card-label { color: #64748b; font-size: 10px; text-transform: uppercase; margin-bottom: 2px; }
    .card-val { color: #f8fafc; font-weight: 600; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: auto;
    }
    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }
    button:active { background: #38bdf8; color: #020617; }
    button.primary { background: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>

  <header>
    <h1>ROVER HW PIPELINE</h1>
    <div id="status-badge" class="status-badge">WAITING FOR SILICON</div>
  </header>

  <!-- Visualizer Canvas for 4 Corners & Scanlines -->
  <canvas id="stage-canvas" width="320" height="240"></canvas>

  <div class="telemetry-grid">
    <div class="card">
      <div class="card-label">Near Lane Corners (x_nl, x_nr)</div>
      <div id="near-corners" class="card-val">-- , --</div>
    </div>
    <div class="card">
      <div class="card-label">Far Lane Corners (x_fl, x_fr)</div>
      <div id="far-corners" class="card-val">-- , --</div>
    </div>
    <div class="card">
      <div class="card-label">1D Otsu Thresholds (Near / Far)</div>
      <div id="otsu-vals" class="card-val">-- / --</div>
    </div>
    <div class="card">
      <div class="card-label">Frame Audit Status</div>
      <div id="drop-reason" class="card-val">READY</div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" onclick="configureDefaults()">Apply Pipeline Config</button>
    <button onclick="requestTestTick()">Re-Query Pipeline</button>
  </div>

  <script>
    const canvas = document.getElementById('stage-canvas');
    const ctx = canvas.getContext('2d');

    let currentNearY = 210;
    let currentFarY = 60;

    function renderEmpty() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, 320, 240);

      // Draw scanline guides
      ctx.strokeStyle = '#334155';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, currentFarY); ctx.lineTo(320, currentFarY);
      ctx.moveTo(0, currentNearY); ctx.lineTo(320, currentNearY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#64748b';
      ctx.font = '10px monospace';
      ctx.fillText(`FAR SCANLINE: y=${currentFarY}`, 6, currentFarY - 4);
      ctx.fillText(`NEAR SCANLINE: y=${currentNearY}`, 6, currentNearY - 4);
    }
    renderEmpty();

    // Configure hardware pipeline through the native AndroidJsBridgeAdapter
    function configureDefaults() {
      if (window.RoverBridge && window.RoverBridge.configurePipeline) {
        // farY, nearY, midpointFocusDiopters, vyThreshold, wMin, wMax, minGauge, maxGauge
        window.RoverBridge.configurePipeline(60, 210, 1.5, 3.0, 4, 24, 80, 260);
        document.getElementById('drop-reason').innerText = 'CONFIG SENT TO NDK';
      } else {
        document.getElementById('drop-reason').innerText = 'ROVER_BRIDGE NOT FOUND';
      }
    }

    function requestTestTick() {
      configureDefaults();
    }

    // Callback invoked automatically from VerificationSessionAdapter.kt
    window.onPipelineResult = function(result) {
      const badge = document.getElementById('status-badge');
      const dropReason = document.getElementById('drop-reason');

      if (!result.frameValid) {
        badge.className = 'status-badge dropped';
        badge.innerText = 'FRAME DROPPED';
        dropReason.innerText = result.reason || 'BLOB/GAUGE FAIL';
        return;
      }

      badge.className = 'status-badge live';
      badge.innerText = 'SILICON PIPELINE LIVE';
      dropReason.innerText = 'PASS (VERIFIED)';

      document.getElementById('near-corners').innerText =
        `${result.nearLeft.x.toFixed(1)}, ${result.nearRight.x.toFixed(1)}`;
      document.getElementById('far-corners').innerText =
        `${result.farLeft.x.toFixed(1)}, ${result.farRight.x.toFixed(1)}`;
      document.getElementById('otsu-vals').innerText =
        `${result.otsuNear} / ${result.otsuFar}`;

      // Draw the verified lane trapezoid & centroids
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, 320, 240);

      // Scanline guides
      ctx.strokeStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(0, result.farLeft.y); ctx.lineTo(320, result.farLeft.y);
      ctx.moveTo(0, result.nearLeft.y); ctx.lineTo(320, result.nearLeft.y);
      ctx.stroke();

      // Green trapezoid formed by the 4 centroids
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(result.nearLeft.x, result.nearLeft.y);
      ctx.lineTo(result.farLeft.x, result.farLeft.y);
      ctx.lineTo(result.farRight.x, result.farRight.y);
      ctx.lineTo(result.nearRight.x, result.nearRight.y);
      ctx.closePath();
      ctx.stroke();

      // Draw 4 blob centroid markers
      ctx.fillStyle = '#22c55e';
      [result.nearLeft, result.nearRight, result.farLeft, result.farRight].forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    };

    // Auto-initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(configureDefaults, 300);
    });
  </script>
</body>
</html>
